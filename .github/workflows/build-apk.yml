name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出项目源码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 设置 JDK 17（Temurin 发行版；setup-android 依赖 JDK 先行）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 安装 Android SDK，自动配置 ANDROID_HOME / ANDROID_SDK_ROOT 环境变量
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 接受 Android SDK 许可证，并安装构建所需的 build-tools 与 platform
      - name: Accept SDK licenses & install components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      # 配置 Gradle：项目缺少 wrapper，因此显式指定 Gradle 8.7 版本并加入 PATH
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 构建 Debug APK：使用系统 gradle 命令（非 ./gradlew），确保 ANDROID_HOME 已暴露
      - name: Build Debug APK
        run: gradle assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 将生成的 debug APK 上传为 artifact，保留 14 天
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
